name: EPİAŞ PTF - main.py

on:
  # KAPATILDI (08.10.2026): eski sistem, yeni Pi cihaz yönetimi + bildirim_isler.py ile mükerrer.
  # Eski zamanlama: '0 */3 * * *'. Yalnız elle çalıştırılabilir.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ptf-cek:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Paketleri kur
        run: pip install --quiet eptr2 twilio requests

      - name: main.py çalıştır
        env:
          EPIAS_KULLANICI: ${{ secrets.EPIAS_KULLANICI }}
          EPIAS_SIFRE: ${{ secrets.EPIAS_SIFRE }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          F2POOL_TOKEN: ${{ secrets.F2POOL_TOKEN }}
          F2POOL_KULLANICI: mehmetas
        run: bash is_calistir.sh "EPİAŞ PTF (3 saatte bir)" python main.py
