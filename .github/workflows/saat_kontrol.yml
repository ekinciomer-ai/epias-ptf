name: Saat Kontrol (Mining)
on:
  # KAPATILDI (08.10.2026): eski sistem, yeni Pi cihaz yönetimi + bildirim_isler.py ile mükerrer.
  # Eski zamanlama: '50 * * * *'. Yalnız elle çalıştırılabilir.
  workflow_dispatch:  # Manuel calistirma

jobs:
  saat-kontrol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Twilio kur
        run: pip install twilio

      - name: Saat kontrol calistir
        env:
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          GH_TOKEN: ${{ secrets.REPO_TOKEN }}
          OTOCOIN_URL: ${{ secrets.OTOCOIN_URL }}
        run: python saat_kontrol.py
