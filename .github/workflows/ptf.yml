name: EPİAŞ PTF Sinyal

on:
  # KAPATILDI (08.10.2026): eski sistem, yeni Pi cihaz yönetimi + bildirim_isler.py ile mükerrer.
  # Eski zamanlama: '*/30 10-15 * * *'. Yalnız elle çalıştırılabilir.
  workflow_dispatch:  # Manuel çalıştırma

permissions:
  contents: write

jobs:
  ptf-sinyal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Paketleri kur
        run: pip install eptr2 twilio

      - name: Scripti çalıştır
        env:
          EPIAS_KULLANICI: ${{ secrets.EPIAS_KULLANICI }}
          EPIAS_SIFRE: ${{ secrets.EPIAS_SIFRE }}
          TWILIO_SID: ${{ secrets.TWILIO_SID }}
          TWILIO_TOKEN: ${{ secrets.TWILIO_TOKEN }}
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          F2POOL_TOKEN: ${{ secrets.F2POOL_TOKEN }}
          F2POOL_KULLANICI: ${{ secrets.F2POOL_KULLANICI }}
        run: bash is_calistir.sh "EPİAŞ PTF sinyal" python main.py
